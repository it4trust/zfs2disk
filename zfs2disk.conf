# zfs2disk_kunden1.conf
# Konfigurationsdatei für zfs2disk.sh (ab Version 3.0)

# --- Allgemeine Pfade ---
LOGFILE="/var/log/zfs2disk.log"
STATUSFILE="/var/log/zfs2disk_status"

# --- Ziel-Medium ---
# Seriennummern der externen USB-Platten (ls /dev/disk/by-id/ | grep usb)
EXTERNAL_SERIALS=("usb-WD_Elements_AE_2689_575841324439354852363948-0:0")

# Name des Pools auf der externen Platte
POOL_NAME="backuppool"

# --- Backup-Strategie (NEU in V3.0) ---

# FORCE_FULL_WIPE: Soll die Festplatte jedes Mal gelöscht werden?
# "yes" = Löscht den Pool jedes Mal und schreibt alles neu (sehr langsam, "Clean Slate")
# "no"  = Versucht inkrementelles Backup (schnell, kopiert nur Änderungen seit dem letzten Mal)
FORCE_FULL_WIPE="no"

# BACKUP_MODE: Was soll gesichert werden?
# "full"   = Überträgt die komplette Snapshot-Historie (empfohlen für maximale Sicherheit)
# "latest" = Überträgt nur den allerneuesten Snapshot (spart Platz auf dem Ziel)
BACKUP_MODE="full"

# CHECKMK_EXPIRY_DAYS:
# Für CheckMK: Nach wie vielen Tagen gilt das Backup als "veraltet"?
# Das Skript schreibt dieses Datum in den CheckMK-Output.
CHECKMK_EXPIRY_DAYS=7

# --- Quell-Daten ---
# WICHTIG: Trage hier die direkten Daten-Datasets ein (z.B. wo die Disk-Images liegen).
# Vermeide reine Container-Ordner wie "rpool/repl", wenn die Kinder unterschiedliche Snapshots haben.
SOURCE_DATASETS=(
    "rpool/repl/pve-mah/rpool/data"
)

# Ausschlüsse (optional)
# Datasets, die übersprungen werden sollen
#EXCLUDE_DATASETS=("rpool/repl/pve-mah/rpool/data/vm-100-temp")

# --- VM Steuerung (Optional) ---
# IDs von VMs/Containern, die während des Backups gestoppt werden sollen.
# (Bei reinen Replikations-Zielen meist leer lassen)
VM_IDS=()
WAIT_AFTER_CRITICAL=30
VM_CHECK_RETRIES=12
